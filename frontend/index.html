<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Your books. Your world. A little of you, on every shelf. Atmyshelf is coming soon." />
    <title>Atmyshelf — your books, your world</title>
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (err) {}
        document.documentElement.dataset.theme =
          stored && stored !== "system"
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        var displayFont = null;
        var textFont = null;
        try {
          displayFont = localStorage.getItem("fontDisplay");
          textFont = localStorage.getItem("fontText");
        } catch (err) {}
        if (displayFont && displayFont !== "theme") document.documentElement.dataset.fontDisplay = displayFont;
        if (textFont && textFont !== "theme") document.documentElement.dataset.fontText = textFont;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

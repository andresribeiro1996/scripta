appId: ${APP_ID}
name: Login and primary navigation
tags:
  - android
  - acceptance
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Your bookshelf, everywhere."
    timeout: 15000
- tapOn: "Email or username"
- inputText: ${USERNAME}
- tapOn: "Password"
- inputText: ${PASSWORD}
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Library"
    timeout: 15000
- tapOn: "Games"
- assertVisible: "Games"
- tapOn: "You"
- assertVisible: "Your shelf"
- tapOn: "Gallery"
- assertVisible: "Upload"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home with a sidebar, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
body{margin:0}
.t-light{--bg:#f2f0ec;--surface:#ffffff;--surface-hover:#f7f5f1;--text:#201e1c;--text-dim:#6b6560;--border:#ddd8d0;--accent:#97532d;--accent-soft:#f1e2d8;--on-accent:#ffffff;--book-shadow:0 1px 2px rgba(32,30,28,.2),0 12px 24px -12px rgba(32,30,28,.5)}
.t-dark{--bg:#141210;--surface:#2a2724;--surface-hover:#333029;--text:#ece8e3;--text-dim:#a8a199;--border:#45403a;--accent:#e08a52;--accent-soft:#3a2c22;--on-accent:#141210;--book-shadow:0 1px 2px rgba(0,0,0,.6),0 14px 28px -12px rgba(0,0,0,.9)}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
.side:hover{background:var(--surface-hover);color:var(--text)}
.row:hover{background:var(--surface-hover)}
.textlink{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px;text-decoration-thickness:1.5px}
</style>
</helmet>
<div class="{{themeClass}}" style="min-height: 100vh; display: flex; flex-wrap: wrap; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 20px">

<aside style="flex: 1 1 248px; max-width: 248px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px; padding: 20px 16px; background: var(--surface); border-right: 1px solid var(--border)">
  <a href="#" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; font-size: 18px; font-weight: 700">
    <svg width="28" height="28" viewBox="0 0 76 76" aria-hidden="true"><g fill="currentColor"><rect x="3.75" y="3" width="11" height="66" transform="rotate(18 14.75 69)"></rect><rect x="55.54" y="3" width="17" height="66" transform="rotate(-18 55.54 69)"></rect><rect x="18" y="41" width="36" height="5"></rect><rect x="0" y="69" width="76" height="5"></rect></g></svg>
    Atmyshelf
  </a>
  <nav aria-label="Main" style="display: flex; flex-direction: column; gap: 2px">
    <a href="#" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11 12 4.5 20 11"></path><path d="M6 9.8V19.5h12V9.8"></path><path d="M10 19.5v-5h4v5"></path></svg>
      <span style="flex: 1">Home</span>
      <span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 12px; line-height: 20px; text-align: center">3</span>
    </a>
    <a class="side" href="Library.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--text-dim); font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v12.5"></path><path d="M12 7c-1.5-1.6-3.6-2.2-8-2.2v12.9c4.4 0 6.5.6 8 2.2"></path><path d="M12 7c1.5-1.6 3.6-2.2 8-2.2v12.9c-4.4 0-6.5.6-8 2.2"></path></svg>
      Library
    </a>
    <a class="side" href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--text-dim); font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"></rect><path d="M10.5 5v14"></path><path d="M10.5 12.2h10"></path></svg>
      Murals
    </a>
    <a class="side" href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--text-dim); font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 4.5h9v4.6a4.5 4.5 0 0 1-9 0z"></path><path d="M7.5 6H5.2a3 3 0 0 0 3 3.2"></path><path d="M16.5 6h2.3a3 3 0 0 1-3 3.2"></path><path d="M12 13.6v3.4"></path><path d="M8.6 19.5h6.8"></path></svg>
      Games
    </a>
    <a class="side" href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--text-dim); font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2"></rect><circle cx="9" cy="10.5" r="2"></circle><path d="M5.8 16.2c.5-1.4 1.7-2.1 3.2-2.1s2.7.7 3.2 2.1"></path><path d="M15 9.5h3"></path><path d="M15 13h3"></path></svg>
      Reader card
    </a>
    <a class="side" href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--text-dim); font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3"></circle><path d="M3.5 19c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8"></path><circle cx="16.5" cy="9.5" r="2.4"></circle><path d="M16.5 14.6c2.2.2 3.7 1.7 4.2 4"></path></svg>
      Community
    </a>
  </nav>
  <div style="flex: 1"></div>
  <div style="display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--border); padding-top: 12px">
    <a class="side" href="Settings.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 8px; color: var(--text-dim); font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M 9.87 5.65 L 10.21 3.18 L 13.79 3.18 L 14.13 5.65 A 6.7 6.7 0 0 1 14.99 6.00 L 16.97 4.50 L 19.50 7.03 L 18.00 9.01 A 6.7 6.7 0 0 1 18.35 9.87 L 20.82 10.21 L 20.82 13.79 L 18.35 14.13 A 6.7 6.7 0 0 1 18.00 14.99 L 19.50 16.97 L 16.97 19.50 L 14.99 18.00 A 6.7 6.7 0 0 1 14.13 18.35 L 13.79 20.82 L 10.21 20.82 L 9.87 18.35 A 6.7 6.7 0 0 1 9.01 18.00 L 7.03 19.50 L 4.50 16.97 L 6.00 14.99 A 6.7 6.7 0 0 1 5.65 14.13 L 3.18 13.79 L 3.18 10.21 L 5.65 9.87 A 6.7 6.7 0 0 1 6.00 9.01 L 4.50 7.03 L 7.03 4.50 L 9.01 6.00 A 6.7 6.7 0 0 1 9.87 5.65 Z"></path><circle cx="12" cy="12" r="3.1"></circle></svg>
      Settings
    </a>
    <button type="button" aria-label="Account menu" style="display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--text); font-size: 14px; cursor: pointer; text-align: left">
      <span style="flex: 0 0 32px; height: 32px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; line-height: 32px; text-align: center">S</span>
      <span style="flex: 1; font-weight: 600">@scripta_dev</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="color: var(--text-dim)"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
    </button>
  </div>
</aside>

<main style="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 40px 48px 72px">
  <div style="max-width: 1100px; margin: 0 auto">
    <h1 style="margin: 0 0 28px; font-family: 'Playfair Display', Georgia, serif; font-size: 40px; line-height: 48px; font-weight: 700">Home</h1>

    <div style="display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start">
      <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 48px">
        <section aria-labelledby="hs-reading">
          <h2 id="hs-reading" style="margin: 0 0 20px; font-family: 'Playfair Display', Georgia, serif; font-size: 24px; line-height: 32px; font-weight: 700">Currently reading <span style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 400; color: var(--text-dim)">6 books</span></h2>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 28px 32px">
            <sc-for list="{{reading}}" as="b" hint-placeholder-count="6">
              <a href="Book.dc.html" style="display: flex; gap: 18px; align-items: center; min-height: 44px">
                <span style="flex: 0 0 80px; aspect-ratio: 2 / 3; border-radius: 2px 5px 5px 2px; background: {{b.bg}}; color: {{b.ink}}; box-shadow: var(--book-shadow); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 9px 10px 12px; box-sizing: border-box">
                  <span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: linear-gradient(90deg, rgba(0,0,0,.22), rgba(255,255,255,.12))"></span>
                  <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 11px; line-height: 13px">{{b.title}}</span>
                  <span style="font-size: 7px; line-height: 9px; opacity: .85">{{b.author}}</span>
                </span>
                <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1">
                  <span style="font-size: 16px; line-height: 22px; font-weight: 600">{{b.title}}</span>
                  <span style="color: var(--text-dim)">{{b.author}}</span>
                  <span style="display: flex; align-items: center; gap: 10px; margin-top: 8px">
                    <span style="flex: 1; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden"><span style="display: block; height: 4px; width: {{b.pct}}; background: var(--accent)"></span></span>
                    <span style="font-size: 12px; line-height: 16px; color: var(--text-dim)">{{b.pct}}</span>
                  </span>
                </span>
              </a>
            </sc-for>
          </div>
        </section>
        <section aria-labelledby="hs-next">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px">
            <h2 id="hs-next" style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 24px; line-height: 32px; font-weight: 700">Up next <span style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 400; color: var(--text-dim)">7 to read</span></h2>
            <a class="textlink" href="Library.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-weight: 600">See all</a>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 24px 18px">
            <sc-for list="{{upNext}}" as="b" hint-placeholder-count="6">
              <a href="Book.dc.html" style="display: flex; flex-direction: column; gap: 10px">
                <span style="aspect-ratio: 2 / 3; border-radius: 2px 5px 5px 2px; background: {{b.bg}}; color: {{b.ink}}; box-shadow: var(--book-shadow); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 14px 10px 10px 14px; box-sizing: border-box">
                  <span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: linear-gradient(90deg, rgba(0,0,0,.22), rgba(255,255,255,.12))"></span>
                  <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 13px; line-height: 16px">{{b.title}}</span>
                  <span style="font-size: 8px; line-height: 10px; opacity: .85">{{b.author}}</span>
                </span>
                <span style="font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{b.title}}</span>
              </a>
            </sc-for>
          </div>
        </section>
      </div>

      <aside style="flex: 1 1 300px; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px">
          <h2 style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700">Activity</h2>
          <span style="padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; line-height: 16px; font-weight: 600">3 new</span>
        </div>
        <ul style="list-style: none; margin: 0; padding: 0 8px 8px">
          <sc-for list="{{activity}}" as="a" hint-placeholder-count="5">
            <li>
              <a class="row" href="#" style="display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; min-height: 44px; box-sizing: border-box">
                <span style="flex: 0 0 32px; height: 32px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; line-height: 32px; text-align: center">{{a.initial}}</span>
                <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                  <span><span style="font-weight: 600">{{a.who}}</span> {{a.text}}</span>
                  <span style="font-size: 12px; line-height: 16px; color: var(--text-dim)">{{a.when}}</span>
                </span>
              </a>
            </li>
          </sc-for>
        </ul>
      </aside>
    </div>
  </div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    return {
      themeClass: dark ? "t-dark" : "t-light",
      reading: [
        { title: "A Clash of Kings", author: "George R.R. Martin", bg: "#2f3a2c", ink: "#e9dcb8", pct: "62%" },
        { title: "Brave New World", author: "Aldous Huxley", bg: "#c4473a", ink: "#fbeee0", pct: "35%" },
        { title: "The Great Gatsby", author: "F. Scott Fitzgerald", bg: "#1f3550", ink: "#e8c879", pct: "81%" },
        { title: "Crime and Punishment", author: "Fyodor Dostoevsky", bg: "#e7dcc6", ink: "#7a2a1f", pct: "12%" },
        { title: "The Picture of Dorian Gray", author: "Oscar Wilde", bg: "#5b3a5e", ink: "#f1e6d0", pct: "47%" },
        { title: "The Odyssey", author: "Homer", bg: "#b8862f", ink: "#231a10", pct: "5%" }
      ],
      upNext: [
        { title: "A Storm of Swords", author: "George R.R. Martin", bg: "#7b2a22", ink: "#f3e1c3" },
        { title: "Fahrenheit 451", author: "Ray Bradbury", bg: "#d9572b", ink: "#1d1410" },
        { title: "Moby-Dick", author: "Herman Melville", bg: "#24435a", ink: "#e9e2cf" },
        { title: "War and Peace", author: "Leo Tolstoy", bg: "#e4d6b8", ink: "#3a2a1a" },
        { title: "Jane Eyre", author: "Charlotte Brontë", bg: "#3d4f3a", ink: "#efe6cf" }
      ],
      activity: [
        { initial: "A", who: "fixture_alice", text: "added Piranesi", when: "2 hours ago" },
        { initial: "C", who: "fixture_charlie", text: "started following you", when: "5 hours ago" },
        { initial: "A", who: "fixture_alice", text: "started following you", when: "Yesterday" },
        { initial: "B", who: "fixture_bob", text: "published a mural, fixture_bob’s reading room", when: "2 days ago" },
        { initial: "A", who: "fixture_alice", text: "published a tournament, Alice’s Top Shelf bracket", when: "3 days ago" }
      ]
    };
  }
}
</script>
</body>
</html>

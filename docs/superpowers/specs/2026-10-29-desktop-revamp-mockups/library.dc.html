<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;display=swap">
<style>
body{margin:0}
.t-light{--bg:#f2f0ec;--surface:#ffffff;--surface-hover:#f7f5f1;--text:#201e1c;--text-dim:#6b6560;--border:#ddd8d0;--accent:#97532d;--accent-soft:#f1e2d8;--on-accent:#ffffff;--topbar:rgba(242,240,236,.88)}
.t-dark{--bg:#141210;--surface:#2a2724;--surface-hover:#333029;--text:#ece8e3;--text-dim:#a8a199;--border:#45403a;--accent:#e08a52;--accent-soft:#3a2c22;--on-accent:#141210;--topbar:rgba(20,18,16,.88)}
a{color:inherit;text-decoration:none}
a:hover{color:inherit}
.navlink:hover{background:var(--surface-hover)}
.tab:hover{color:var(--text)}
.chip:hover{background:var(--surface-hover)}
.btn2:hover{background:var(--surface-hover)}
.tile:hover .tile-cover{transform:translateY(-3px)}
.tile-cover{transition:transform .18s cubic-bezier(.32,.72,0,1)}
</style>
</helmet>
<div class="{{themeClass}}" style="min-height: 100vh; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 20px">

<header style="position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 28px; min-height: 64px; padding: 0 32px; flex-wrap: wrap; background: var(--topbar); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border)">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 18px; font-weight: 700">
    <svg width="28" height="28" viewBox="0 0 76 76" aria-hidden="true"><g fill="currentColor"><rect x="3.75" y="3" width="11" height="66" transform="rotate(18 14.75 69)"></rect><rect x="55.54" y="3" width="17" height="66" transform="rotate(-18 55.54 69)"></rect><rect x="18" y="41" width="36" height="5"></rect><rect x="0" y="69" width="76" height="5"></rect></g></svg>
    Atmyshelf
  </a>
  <nav aria-label="Main" style="display: flex; align-items: center; gap: 2px; flex: 1; flex-wrap: wrap">
    <a class="navlink" href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; color: var(--text-dim); font-weight: 600">Home <span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 12px; line-height: 20px; text-align: center">3</span></a>
    <a href="#" aria-current="page" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600">Library</a>
    <a class="navlink" href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; color: var(--text-dim); font-weight: 600">Murals</a>
    <a class="navlink" href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; color: var(--text-dim); font-weight: 600">Games</a>
    <a class="navlink" href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; color: var(--text-dim); font-weight: 600">Reader card</a>
    <a class="navlink" href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; color: var(--text-dim); font-weight: 600">Community</a>
  </nav>
  <button type="button" aria-label="Account menu" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 6px 0 4px; border: 0; border-radius: 999px; background: transparent; color: var(--text-dim); cursor: pointer">
    <span style="width: 34px; height: 34px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 14px; line-height: 34px; text-align: center">S</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
</header>

<main style="max-width: 1600px; margin: 0 auto; padding: 40px 32px 72px; box-sizing: border-box">
  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap">
    <div>
      <h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-size: 40px; line-height: 48px; font-weight: 700">Library</h1>
      <p style="margin: 6px 0 0; color: var(--text-dim)">Dev Library · 24 books</p>
    </div>
    <div style="display: flex; gap: 8px; align-items: center">
      <button class="btn2" type="button" aria-label="More library actions" style="width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 8px; border: 0; background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 600; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Add a book
      </button>
    </div>
  </div>

  <nav aria-label="Library sections" style="display: flex; gap: 28px; margin-top: 24px; border-bottom: 1px solid var(--border)">
    <a href="#" aria-current="page" style="display: flex; align-items: center; min-height: 44px; margin-bottom: -1px; border-bottom: 2px solid var(--accent); font-weight: 600">Books</a>
    <a class="tab" href="#" style="display: flex; align-items: center; min-height: 44px; color: var(--text-dim); font-weight: 600">Series</a>
    <a class="tab" href="#" style="display: flex; align-items: center; min-height: 44px; color: var(--text-dim); font-weight: 600">Collections</a>
    <a class="tab" href="#" style="display: flex; align-items: center; min-height: 44px; color: var(--text-dim); font-weight: 600">Gallery</a>
  </nav>

  <div style="position: sticky; top: 65px; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px 0; background: var(--bg)">
    <label style="position: relative; flex: 0 1 340px; min-width: 220px">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search your library</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 14px; color: var(--text-dim)"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
      <input type="search" placeholder="Search title or author" style="width: 100%; box-sizing: border-box; min-height: 44px; padding: 0 14px 0 40px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 15px">
    </label>
    <div role="group" aria-label="Status" style="display: flex; gap: 6px; flex-wrap: wrap">
      <button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--text); background: var(--text); color: var(--bg); font-size: 14px; font-weight: 600; cursor: pointer">All <span style="opacity: .7; font-weight: 400">24</span></button>
      <button class="chip" type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer">Reading <span style="color: var(--text-dim); font-weight: 400">6</span></button>
      <button class="chip" type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer">To read <span style="color: var(--text-dim); font-weight: 400">7</span></button>
      <button class="chip" type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer">Finished <span style="color: var(--text-dim); font-weight: 400">11</span></button>
    </div>
    <label style="margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--text-dim)">
      Sort
      <select style="min-height: 44px; padding: 0 36px 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 600">
        <option>My order</option>
        <option>Recently added</option>
        <option>Title</option>
        <option>Author</option>
      </select>
    </label>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px 20px; margin-top: 8px">
    <sc-for list="{{books}}" as="b" hint-placeholder-count="18">
      <a class="tile" href="Book.dc.html" aria-label="{{b.title}} by {{b.author}}, {{b.status}}" style="display: block">
        <span class="tile-cover" style="display: flex; flex-direction: column; justify-content: space-between; aspect-ratio: 2 / 3; border-radius: 16px; background: {{b.bg}}; color: {{b.ink}}; position: relative; overflow: hidden; padding: 22px 18px; box-sizing: border-box">
          <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 22px; line-height: 26px">{{b.title}}</span>
          <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 46%; background: linear-gradient(180deg, rgba(10,8,6,0), rgba(10,8,6,.78))"></span>
          <span style="position: relative; display: flex; flex-direction: column; gap: 2px; color: #ffffff">
            <span style="font-size: 15px; line-height: 20px; font-weight: 600">{{b.title}}</span>
            <span style="font-size: 12px; line-height: 16px; opacity: .9">{{b.author}}</span>
            <span style="font-size: 11px; line-height: 14px; opacity: .75">{{b.status}}</span>
          </span>
        </span>
      </a>
    </sc-for>
  </div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1320}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    return {
      themeClass: dark ? "t-dark" : "t-light",
      books: [
        { title: "The Fellowship of the Ring", author: "J.R.R. Tolkien", status: "Finished", bg: "#1c1a17", ink: "#d8b25a" },
        { title: "The Two Towers", author: "J.R.R. Tolkien", status: "Finished", bg: "#231d18", ink: "#d8b25a" },
        { title: "The Return of the King", author: "J.R.R. Tolkien", status: "Finished", bg: "#181713", ink: "#d8b25a" },
        { title: "A Game of Thrones", author: "George R.R. Martin", status: "Finished", bg: "#9fb9cf", ink: "#1b2a38" },
        { title: "A Clash of Kings", author: "George R.R. Martin", status: "Reading", bg: "#2f3a2c", ink: "#e9dcb8" },
        { title: "A Storm of Swords", author: "George R.R. Martin", status: "To read", bg: "#7b2a22", ink: "#f3e1c3" },
        { title: "The Hobbit", author: "J.R.R. Tolkien", status: "Finished", bg: "#3f7a46", ink: "#f2ead2" },
        { title: "1984", author: "George Orwell", status: "Finished", bg: "#d23a2c", ink: "#111111" },
        { title: "Brave New World", author: "Aldous Huxley", status: "Reading", bg: "#c4473a", ink: "#fbeee0" },
        { title: "Fahrenheit 451", author: "Ray Bradbury", status: "To read", bg: "#d9572b", ink: "#1d1410" },
        { title: "Pride and Prejudice", author: "Jane Austen", status: "Finished", bg: "#e9dccb", ink: "#5a3326" },
        { title: "To Kill a Mockingbird", author: "Harper Lee", status: "Finished", bg: "#5c6e48", ink: "#f4ecd6" },
        { title: "The Great Gatsby", author: "F. Scott Fitzgerald", status: "Reading", bg: "#1f3550", ink: "#e8c879" },
        { title: "Moby-Dick", author: "Herman Melville", status: "To read", bg: "#24435a", ink: "#e9e2cf" },
        { title: "War and Peace", author: "Leo Tolstoy", status: "To read", bg: "#e4d6b8", ink: "#3a2a1a" },
        { title: "Crime and Punishment", author: "Fyodor Dostoevsky", status: "Reading", bg: "#e7dcc6", ink: "#7a2a1f" },
        { title: "Dracula", author: "Bram Stoker", status: "Finished", bg: "#3a0f12", ink: "#e9d8c0" },
        { title: "Frankenstein", author: "Mary Shelley", status: "Finished", bg: "#3b4a44", ink: "#e5e9df" }
      ]
    };
  }
}
</script>
</body>
</html>
